services:
  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    container_name: agentique-mcp-server
    ports:
      - "8000:8000"
    environment:
      AGENTIQUE_TRANSPORT: http
      AGENTIQUE_HOST: 0.0.0.0
      AGENTIQUE_PORT: 8000
      AGENTIQUE_AGENTS: ${AGENTIQUE_AGENTS:-}
    volumes:
      - ./src:/app/src:ro
    restart: unless-stopped
