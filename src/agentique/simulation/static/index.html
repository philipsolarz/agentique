<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentique Simulation</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>Agentique Simulation</h1>
    <div class="status-bar">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
      </div>
      <span class="mcp-url" id="mcpUrl"></span>
    </div>
  </div>

  <!-- Simulation Banner -->
  <div class="simulation-banner" id="simulationBanner">
    <div class="sim-info">
      <span class="sim-persona" id="simPersona"></span>
      <span class="sim-objective" id="simObjective"></span>
    </div>
    <div class="sim-stats">
      <div class="sim-stat">
        <span class="sim-stat-label">Turn</span>
        <span class="sim-stat-value" id="simTurnCount">0</span>
      </div>
      <div class="sim-stat">
        <span class="sim-stat-label">State</span>
        <span class="sim-stat-value" id="simState">idle</span>
      </div>
      <div class="sim-stat">
        <span class="sim-stat-label">Insights</span>
        <span class="sim-stat-value" id="simInsights">0</span>
      </div>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="main">

    <!-- Chat Panel (Observer Only) -->
    <div class="chat-panel">
      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <div class="icon">&#x1f916;</div>
          <div>Waiting for simulation to start...</div>
          <div style="font-size: 11px; color: var(--text-muted);">
            Start a simulation via the Simulator MCP Server
          </div>
        </div>
      </div>

      <!-- Visual Typing Area (shows simulated typing) -->
      <div class="typing-area" id="typingArea">
        <div class="typing-preview" id="typingPreview">
          <span id="typingText"></span><span class="cursor"></span>
        </div>
      </div>
    </div>

    <!-- Event Log + Info Panel -->
    <div class="event-panel">
      <div class="event-panel-header">
        <span>Events</span>
        <button onclick="clearEventLog()">Clear</button>
      </div>

      <!-- Simulation Info -->
      <div class="simulation-info" id="simulationInfo">
        <div class="info-row">
          <span class="info-label">Persona</span>
          <span class="info-value" id="infoPersona">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Objective</span>
          <span class="info-value" id="infoObjective">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">State</span>
          <span class="info-value" id="infoState">idle</span>
        </div>
        <div class="info-row">
          <span class="info-label">Turns</span>
          <span class="info-value" id="infoTurns">0</span>
        </div>
      </div>

      <!-- Event Log -->
      <div class="event-log" id="eventLog"></div>
    </div>
  </div>

  <!-- Playback Controls -->
  <div class="playback-controls">
    <div class="speed-control">
      <label>Animation Speed</label>
      <input type="range" id="speedSlider" min="0.5" max="5" step="0.5" value="1"
             oninput="updateSpeed(this.value)">
      <span id="speedDisplay">1x</span>
    </div>
  </div>

  <script src="/static/simulator.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
