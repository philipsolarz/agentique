<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentique Test Client</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>Agentique Test Client</h1>
    <div class="status-bar">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
      </div>
      <span class="mcp-url" id="mcpUrl"></span>
    </div>
  </div>

  <!-- Main layout -->
  <div class="main">
    <!-- Chat panel -->
    <div class="chat-panel">
      <div class="messages" id="messages">
        <div class="message system">
          Welcome to the Agentique Test Client. Connect to an MCP server to begin.
        </div>
      </div>

      <!-- Input area -->
      <div class="input-area">
        <!-- Simulation Controls (hidden by default) -->
        <div class="simulation-controls" id="simulationControls" style="display: none;">
          <div class="sim-status">
            <span class="sim-indicator">🎬</span>
            <span class="sim-label">Simulation Active</span>
          </div>
          <div class="sim-controls-group">
            <button class="btn-sim" id="pauseSimulationBtn">⏸️ Pause</button>
            <div class="speed-control">
              <label>Speed:</label>
              <input type="range" id="speedSlider" min="0.5" max="5" step="0.5" value="1">
              <span id="speedDisplay">1.0x</span>
            </div>
            <button class="btn-sim danger" id="stopSimulationBtn">⏹️ Stop</button>
          </div>
        </div>

        <div class="input-row">
          <input type="text" id="messageInput" placeholder="Type a message..." disabled>
          <button class="btn" id="sendBtn" disabled>Send</button>
        </div>
        <div class="scenario-row">
          <label>Scenario:</label>
          <select id="scenarioSelect" disabled>
            <option value="">-- select --</option>
          </select>
          <button class="btn secondary" id="runScenarioBtn" disabled>Run</button>
          <button class="btn secondary" id="runAllBtn" disabled>Run All</button>
          <label class="scenario-mode-toggle">
            <input type="checkbox" id="simulationMode" checked>
            <span>Visual Simulation</span>
          </label>
        </div>

        <!-- Autonomous Agent Panel -->
        <div class="autonomous-panel">
          <div class="autonomous-header">
            <span class="autonomous-title">🤖 AI Test Agent</span>
            <button class="btn-autonomous" id="startAutonomousBtn" disabled>🚀 Start Autonomous Testing</button>
          </div>
          <div class="autonomous-status" id="autonomousStatus" style="display: none;">
            <span class="status-icon">⏳</span>
            <span class="status-message" id="autonomousStatusMessage">Initializing...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Event log panel -->
    <div class="event-panel">
      <div class="event-panel-header">
        <span>Event Log</span>
        <button id="clearEventsBtn">Clear</button>
      </div>
      <div class="event-log" id="eventLog"></div>
    </div>
  </div>

  <!-- Elicitation modal -->
  <div class="modal-overlay" id="elicitModal">
    <div class="modal">
      <h3>Input Required</h3>
      <p id="elicitMessage">The agent is requesting input.</p>
      <input type="text" id="elicitInput" placeholder="Your response...">
      <div class="modal-actions">
        <button class="btn secondary" id="elicitCancelBtn">Cancel</button>
        <button class="btn" id="elicitSubmitBtn">Submit</button>
      </div>
    </div>
  </div>

  <script src="/static/simulator.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
