name: "01_discovery"
description: "Tool discovery — list tools and verify core tools present"
tags: ["discovery", "smoke"]
steps:
  - name: "list_all_tools"
    action: list_tools
    timeout: 15
    assertions:
      - type: contains
        value: "agent"
      - type: contains
        value: "agents"
      - type: response_time_lt
        value: 10000
