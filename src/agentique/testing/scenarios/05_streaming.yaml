name: "05_streaming"
description: "Streaming — verify log messages arrive during execution"
tags: ["streaming", "notifications"]
steps:
  - name: "streaming_request"
    action: send_message
    message: "What is 2 plus 2?"
    timeout: 30
    assertions:
      - type: has_log
      - type: response_time_lt
        value: 30000
