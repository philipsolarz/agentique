name: "02_list_agents"
description: "List agents — call agents tool and verify agent data"
tags: ["agents", "smoke"]
steps:
  - name: "call_agents_tool"
    action: call_tool
    tool: "agents"
    timeout: 15
    assertions:
      - type: contains
        value: "agent"
      - type: tool_called
        value: "agents"
      - type: response_time_lt
        value: 10000
