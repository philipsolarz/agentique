# Virtual workspace root: this file configures the uv workspace and shared
# tooling, but is NOT itself a buildable package (no [project], no
# [build-system]). The installable packages live under packages/*.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "ty",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-ra"
asyncio_mode = "auto"
# No `pythonpath` override: `uv sync` installs every workspace member as an
# editable install (a `.pth` per package pointing at its `src`), so the shared
# `agentique.*` namespace merges across all members and resolves to live source.
# pytest's own rootdir insertion makes the private `_stub`/`_fake_tool` test
# helpers importable within each tests/ directory.

# No `[tool.ty.environment] extra-paths`: ty resolves against the project venv,
# where the editable installs present a single merged `agentique.*` namespace.
# (Feeding ty the six raw src roots instead made it unable to merge the namespace
# portions across roots — a PEP 420 + preview-ty limitation we hit and removed.)
