[project]
name = "agentique"
version = "0.0.1"
description = "Agentique: an application-agnostic Python agent framework."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Philip Solarz", email = "philipsolarz@outlook.com" },
]
dependencies = []

[project.optional-dependencies]
# The Anthropic provider (agentique.anthropic) is the only submodule that imports
# a third-party SDK. It lives behind this extra so `pip install agentique` pulls
# zero third-party deps; `agentique[anthropic]` adds exactly the SDK.
anthropic = ["anthropic>=0.40"]

[project.scripts]
# The conversational console REPL: run `agentique` once installed (or `uv run agentique`).
agentique = "agentique.console.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "ty",
    # The Anthropic SDK is a runtime *extra* (above), not a base dependency. It is
    # also pulled into the dev environment here so `ty check` and `pytest` can load
    # `agentique.anthropic` under `make check`. `pip install agentique` stays clean.
    "anthropic>=0.40",
]

[tool.uv.workspace]
# Self-anchor as a single-package workspace (root is the only member). Without a
# `[tool.uv.workspace]` table, uv walks up the filesystem and would attach this
# project to an ancestor workspace.
members = []

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
# The dev-only `observability` package lives at the repo root (outside `src/`, so
# it is never shipped). Put the root on the path so `tests/observability` can
# import it. `scenarios/` is added for the Part-2/Part-3 driver tests.
pythonpath = ["."]
