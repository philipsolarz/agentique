[project]
name = "agentique"
version = "0.4.0"
description = "Protocol-agnostic bridge between MCP clients and any agent ecosystem."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0b1",
    "a2a-sdk>=0.3.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
adk = [
    "google-adk",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "google-adk",
    "testcontainers[redis]>=4.0",
    "fakeredis>=2.33",
    "boto3>=1.34",
    "redis>=5.0",
    "aiohttp>=3.9",
    "opentelemetry-sdk>=1.24",
    "pytest-cov>=5.0",
]
ui = [
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
]

[project.scripts]
agentique = "agentique.__main__:main"

[project.entry-points."agentique.adapters"]
# Built-in adapters are registered via @register_adapter decorator.
# Third-party packages can add their own entry points here:
# openai = "agentique_openai:OpenAIAdapterFactory"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
timeout = 30
markers = [
    "unit: Fast isolated unit tests (no external deps)",
    "integration: Tests requiring running services or in-memory servers",
    "e2e: Full end-to-end tests against Docker Compose stack",
    "slow: Tests taking more than 5 seconds",
]
