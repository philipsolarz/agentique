[project]
name = "agentique"
version = "0.4.0"
description = "Protocol-agnostic bridge between MCP clients and any agent ecosystem."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0b1",
    "a2a-sdk>=0.3.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
adk = [
    "google-adk",
]
ui = [
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
    "starlette>=0.40.0",
    "google-generativeai>=0.8.0",
]

[project.scripts]
agentique = "agentique.__main__:main"

[project.entry-points."agentique.adapters"]
# Built-in adapters are registered via @register_adapter decorator.
# Third-party packages can add their own entry points here:
# openai = "agentique_openai:OpenAIAdapterFactory"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
