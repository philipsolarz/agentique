# Docker Compose configuration for interactive testing with MCP clients
# This setup exposes the MCP server for manual testing via Claude CLI, GitHub Copilot, etc.
#
# Prerequisites:
#   - GOOGLE_API_KEY must be set in .env or environment (required for the LLM-powered agent)
#   - Docker and Docker Compose installed

services:
  # Real LLM-powered A2A agent built with Google ADK + Gemini
  # Features: 7 sub-agents, natural language routing, 25+ tools, streaming, elicitation
  a2a-agent:
    build:
      context: .
      dockerfile: docker/a2a-test-agent/Dockerfile
    container_name: agentique-interactive-agent
    ports:
      - "9000:9000"
    environment:
      A2A_HOST: 0.0.0.0
      A2A_PORT: 9000
      A2A_BASE_URL: http://a2a-agent:9000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ADK_MODEL: ${ADK_MODEL:-gemini-2.0-flash}
    volumes:
      - ./a2a_test_agent/agent_card.json:/app/agent_card.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/.well-known/agent-card.json')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - agentique-interactive

  # MCP Server (Agentique Bridge) - Exposed for interactive testing
  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    container_name: agentique-interactive-mcp-server
    ports:
      - "8000:8000" # HTTP mode
    stdin_open: true # Enable stdin for stdio mode
    tty: true # Enable TTY
    depends_on:
      a2a-agent:
        condition: service_healthy
    environment:
      # Transport configuration
      AGENTIQUE_TRANSPORT: http # Can be 'http' or 'stdio'
      AGENTIQUE_HOST: 0.0.0.0
      AGENTIQUE_PORT: 8000

      # Agent configuration (format: name=url|skill1,skill2)
      AGENTIQUE_AGENTS: "root=http://a2a-agent:9000"

      # Enable debug logging for interactive testing
      LOG_LEVEL: DEBUG
      AGENTIQUE_DEBUG: "1"

    volumes:
      - ./src:/app/src:ro  # Mount source code for live reload
      - /app/.venv          # Keep container's own venv (don't overwrite)

    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',8000)); s.close()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - agentique-interactive

    # Labels for easy identification
    labels:
      com.agentique.purpose: "interactive-testing"
      com.agentique.mcp.client: "compatible"

  # Web-based MCP test client with visual chat UI
  test-ui:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    container_name: agentique-interactive-test-ui
    ports:
      - "8080:8080"
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      LOG_LEVEL: INFO
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    command: ["uv", "run", "--no-sync", "python", "-m", "agentique.testing.client", "--mcp-url", "http://mcp-server:8000/mcp", "--port", "8080"]
    networks:
      - agentique-interactive
    labels:
      com.agentique.purpose: "test-ui"

networks:
  agentique-interactive:
    driver: bridge
    name: agentique-interactive

# Usage:
# 1. Set GOOGLE_API_KEY in .env or export it:
#    echo "GOOGLE_API_KEY=your-key-here" > .env
#
# 2. Start the stack:
#    docker compose -f docker-compose.interactive.yml up -d --wait
#
# 3. Verify health:
#    curl http://localhost:8000/health
#    curl http://localhost:9000/.well-known/agent-card.json
#
# 4. Configure your MCP client (see examples/mcp-clients/README.md)
#
# 5. Test via Claude CLI:
#    claude "List available agents"
#    claude "What is 15 times 7?"
#    claude "Sort these items: banana, apple, cherry"
#
# 6. Stop the stack:
#    docker compose -f docker-compose.interactive.yml down
