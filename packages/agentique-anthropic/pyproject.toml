[project]
name = "agentique-anthropic"
version = "0.0.1"
description = "Agentique Anthropic provider: a Model implementation over the Anthropic Messages API."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Philip Solarz", email = "philipsolarz@outlook.com" },
]
dependencies = [
    "agentique-core",
    "anthropic>=0.40",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace = true
module-name = "agentique.anthropic"

[tool.uv.sources]
agentique-core = { workspace = true }
