[project]
name = "agentique-core"
version = "0.0.1"
description = "Agentique core: an application-agnostic Python agent framework."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Philip Solarz", email = "philipsolarz@outlook.com" },
]
dependencies = []

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace = true
module-name = "agentique.core"
